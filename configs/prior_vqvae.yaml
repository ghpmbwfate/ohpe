# Hierarchical VQ-VAE Prior Training Config
codebook_size: 2048
embed_dim: 512
head_tokens: 10
arm_tokens: 12
leg_tokens: 12
global_tokens: 34
num_mixer_blocks: 4
expansion_factor: 4
dropout: 0.0

# Training
batch_size: 32
lr: 0.0008
weight_decay: 0.05
epochs: 300
num_workers: 4

# Data
image_size: 256
num_keypoints: 17

# Logging
save_dir: ./checkpoints/prior
log_interval: 100
save_interval: 10
